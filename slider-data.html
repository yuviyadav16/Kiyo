<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: system-ui, sans-serif;}
        .slider-container { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.08); background: #e2e8f0;}
        .slides { display: flex; width: 100%; height: 100%; transition: transform 0.5s ease-in-out; }
        .slide { min-width: 100%; height: 100%; text-decoration: none; position: relative; display: block;}
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slide-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); color: white; box-sizing: border-box;}
        .slide-overlay h4 { margin: 0 0 3px 0; font-size: 15px; font-weight: 800; }
        .slide-overlay p { margin: 0; font-size: 11px; opacity: 0.9; font-weight: 600;}
        .slide-dots { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; z-index: 10;}
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: #fff; width: 14px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="slider-container">
        <div class="slides" id="slides">
            <!-- POSTER 1 (Yahan link aur image change kar sakte ho) -->
            <a href="batches.html" class="slide" target="_parent">
                <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?q=80&w=1000&auto=format&fit=crop" alt="Poster 1">
                <div class="slide-overlay">
                    <h4>Top NEET & JEE Batches 2026</h4>
                    <p>Master concepts with AI mentorship</p>
                </div>
            </a>
            <!-- POSTER 2 -->
            <a href="study.html" class="slide" target="_parent">
                <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=1000&auto=format&fit=crop" alt="Poster 2">
                <div class="slide-overlay">
                    <h4>Daily Practice Papers (DPPs)</h4>
                    <p>Solve curated questions & track growth</p>
                </div>
            </a>
            <!-- POSTER 3 -->
            <a href="batches.html" class="slide" target="_parent">
                <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1000&auto=format&fit=crop" alt="Poster 3">
                <div class="slide-overlay">
                    <h4>24/7 AI Doubt Solving</h4>
                    <p>Get instant explanations anytime</p>
                </div>
            </a>
        </div>
        <div class="slide-dots" id="slideDots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.getElementById('slides');
        const dots = document.querySelectorAll('.dot');
        const totalDots = dots.length;

        setInterval(() => {
            currentSlide = (currentSlide + 1) % totalDots;
            slides.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach(d => d.classList.remove('active'));
            dots[currentSlide].classList.add('active');
        }, 3500);
    </script>
</body>
</html>
