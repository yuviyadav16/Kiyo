<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Secure Portal Login</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b1120;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow-x: hidden; color: #fff;
        }

        /* Main Login Card */
        .login-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            width: 90%; max-width: 400px;
            padding: 30px 25px;
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.6);
            display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box;
            margin-top: auto; margin-bottom: auto;
        }

        /* Logo Area */
        .logo-container {
            position: relative; width: 75px; height: 75px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px;
        }
        .logo-container::before {
            content: ''; position: absolute; width: 70px; height: 70px;
            background: #7c3aed; border-radius: 50%; filter: blur(25px); opacity: 0.5;
        }
        .logo-img {
            width: 70px; height: 70px; border-radius: 50%; object-fit: cover;
            position: relative; z-index: 1; background: #fff;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.5);
        }

        .brand-title {
            font-size: 24px; font-weight: 800; letter-spacing: 1.5px; margin: 0;
            color: #f8fafc; text-align: center;
        }
        .brand-sub {
            font-size: 12px; color: #94a3b8; letter-spacing: 0.5px; margin-top: 4px;
            margin-bottom: 22px; text-align: center; text-transform: uppercase;
        }

        /* Toggle Switch Tabs (Sign In / Sign Up) */
        .tab-switcher {
            display: flex; background: rgba(2, 6, 23, 0.6);
            border-radius: 14px; padding: 4px; width: 100%; margin-bottom: 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            flex: 1; padding: 10px 0; text-align: center; font-size: 14px;
            font-weight: 700; color: #94a3b8; cursor: pointer; border-radius: 10px;
            transition: all 0.3s ease; border: none; background: transparent;
        }
        .tab-btn.active {
            background: #2563eb; color: #ffffff;
            box-shadow: 0px 4px 15px rgba(37, 99, 235, 0.4);
        }

        /* Form Fields */
        .input-group {
            position: relative; width: 100%; margin-bottom: 14px;
        }
        .input-group i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #64748b; font-size: 15px;
        }
        .input-field {
            width: 100%; padding: 12px 15px 12px 45px;
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff; font-size: 14px; box-sizing: border-box;
            outline: none; transition: border-color 0.3s;
        }
        .input-field:focus { border-color: #3b82f6; }
        .toggle-password {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            color: #64748b; cursor: pointer; font-size: 14px;
        }

        /* Action Button */
        .action-btn {
            width: 100%; padding: 13px 0; background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; border-radius: 12px; font-size: 15px;
            font-weight: 700; cursor: pointer; margin-top: 6px; margin-bottom: 15px;
            box-shadow: 0px 6px 20px rgba(37, 99, 235, 0.4); transition: transform 0.2s;
        }
        .action-btn:active { transform: scale(0.98); }

        .forgot-link {
            font-size: 12px; color: #60a5fa; text-decoration: none; text-align: right;
            display: block; width: 100%; margin-bottom: 5px; font-weight: 600;
        }
        .forgot-link:hover { text-decoration: underline; }

        /* Footer Support & Links */
        .support-text {
            font-size: 11px; color: #64748b; margin-top: 15px; text-align: center;
        }
        .social-row {
            display: flex; justify-content: center; gap: 15px; margin-top: 8px;
        }
        .social-row a { color: #64748b; font-size: 14px; text-decoration: none; transition: color 0.3s; }
        .social-row a:hover { color: #fff; }

        /* Global Footer */
        .page-footer {
            margin-top: auto; padding: 15px 0; font-size: 11px; color: #64748b;
            text-align: center; width: 100%; border-top: 1px solid rgba(255,255,255,0.03);
        }
        .page-footer a { color: #94a3b8; text-decoration: none; margin: 0 5px; }
        .page-footer a:hover { color: #fff; }

        /* Modal for Forgot Password */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: #1e293b; padding: 25px; border-radius: 20px; width: 85%; max-width: 330px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center; position: relative;
        }
        .close-modal { position: absolute; top: 12px; right: 15px; color: #94a3b8; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-container">
            <img src="15026_2.png" alt="Kiyo AI Logo" class="logo-img">
        </div>
        <div class="brand-title">Kiyo AI</div>
        <div class="brand-sub">Intelligent Learning Guide</div>

        <!-- Tabs -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="signinTabBtn" onclick="switchTab('signin')">Sign In</button>
            <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Form Container -->
        <form id="authForm" onsubmit="handleSubmit(event)" style="width: 100%;">
            
            <!-- Extra Fields for Sign Up -->
            <div id="signupFields" style="display: none;">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="fullName" class="input-field" placeholder="Full Student Name">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date" id="dob" class="input-field" placeholder="Date of Birth">
                </div>
            </div>

            <!-- Common Fields -->
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" class="input-field" placeholder="Student Email ID" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" class="input-field" placeholder="Password" required>
                <i class="fa-solid fa-eye toggle-password" onclick="togglePass()"></i>
            </div>

            <a href="#" class="forgot-link" onclick="openForgotModal(event)">Forgot Password?</a>

            <button type="submit" class="action-btn" id="submitBtn">SEND VERIFICATION OTP</button>
        </form>

        <div class="support-text">Need Help? Contact TicBull Support</div>
        <div class="social-row">
            <a href="mailto:ticbull.support@gmail.com"><i class="fa-solid fa-envelope"></i></a>
            <a href="https://t.me/ticbullteam" target="_blank"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://www.instagram.com/ticbull" target="_blank"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeForgotModal()">&times;</span>
            <h3 style="margin-top:0; color:#fff; font-size:18px;"><i class="fa-solid fa-key" style="color:#f59e0b;"></i> Reset Password</h3>
            <div class="input-group" style="margin-top: 15px;">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="resetEmail" class="input-field" placeholder="Registered Email ID">
            </div>
            <button type="button" class="action-btn" onclick="sendResetOtp()">SEND RESET OTP</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="page-footer">
        <div>
            <a href="#">Privacy Policy</a> | 
            <a href="#">Terms & Conditions</a> | 
            <a href="#">Refund Policy</a> | 
            <a href="#">Contact Us</a>
        </div>
        <div style="margin-top: 5px;">&copy; 2026 Kiyo AI. All rights reserved.</div>
    </div>

    <script>
        let currentMode = 'signin';

        function switchTab(mode) {
            currentMode = mode;
            const signinBtn = document.getElementById('signinTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');
            const signupFields = document.getElementById('signupFields');
            const submitBtn = document.getElementById('submitBtn');

            if (mode === 'signin') {
                signinBtn.classList.add('active');
                signupBtn.classList.remove('active');
                signupFields.style.display = 'none';
                submitBtn.innerText = "SEND VERIFICATION OTP";
            } else {
                signupBtn.classList.add('active');
                signinBtn.classList.remove('active');
                signupFields.style.display = 'block';
                submitBtn.innerText = "CREATE ACCOUNT WITH OTP";
            }
        }

        function togglePass() {
            const passInput = document.getElementById('password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
            } else {
                passInput.type = 'password';
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(currentMode === 'signin' ? `Sending Sign-In OTP to ${email}` : `Sending Account Verification OTP to ${email}`);
            // Yahan backend API call aayega jo Firebase aur SMTP OTP trigger karega
        }

        function openForgotModal(e) {
            e.preventDefault();
            document.getElementById('forgotModal').classList.add('active');
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
        }

        function sendResetOtp() {
            const resetEmail = document.getElementById('resetEmail').value;
            if(!resetEmail) { alert("Please enter your registered email"); return; }
            alert(`Reset Password OTP sent to ${resetEmail}`);
            closeForgotModal();
        }
    </script>
</body>
</html>
