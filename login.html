<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiyo AI - Intelligent Learning</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1; --primary-dark: #4338ca; --primary-light: rgba(99, 102, 241, 0.1);
            --accent-green: #10b981; --accent-green-hover: #059669;
            --bg-gradient: linear-gradient(180deg, #ede9fe 0%, #f8fafc 40%, #ffffff 100%);
            --danger: #ef4444; --success: #10b981;
            --text-main: #0f172a; --text-muted: #64748b;
            --input-border: #e2e8f0; --input-bg: #ffffff;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; background: var(--bg-gradient); font-family: system-ui, sans-serif; color: var(--text-main); overflow: hidden; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .main-wrapper { width: 100%; max-width: 400px; margin: 0 auto; height: 100%; padding: 25px 20px 15px 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .header-section { text-align: center; margin-bottom: 25px; margin-top: 10px; flex-shrink: 0; }
        .header-section h1 { font-size: 32px; font-weight: 900; margin: 0; color: #1e1b4b; }
        .brand-highlight { color: var(--accent-green); }
        .tab-switcher { display: flex; background: rgba(99, 102, 241, 0.08); border-radius: 14px; padding: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 0; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-radius: 10px; border: none; background: transparent; }
        .tab-btn.active { background: #ffffff; color: var(--primary-dark); box-shadow: 0px 4px 10px rgba(0,0,0,0.05); }
        .input-group { position: relative; width: 100%; margin-bottom: 12px; }
        .input-field { width: 100%; padding: 14px 15px 14px 42px; background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: 14px; font-size: 14px; font-weight: 600; box-sizing: border-box; outline: none; }
        .action-btn { width: 100%; padding: 16px; background: var(--accent-green); color: white; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .custom-select-btn { width: 100%; padding: 14px 15px; background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: 14px; color: var(--text-muted); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .bottom-sheet { background: white; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 20px; transform: translateY(100%); transition: 0.3s; }
        .modal-overlay.active .bottom-sheet { transform: translateY(0); }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 15px; border-radius: 10px; z-index: 9999; display: none; }
    </style>
</head>
<body>
    <div id="toastBox" class="toast"></div>
    <div class="main-wrapper">
        <div class="header-section"><h1>Welcome to<br><span class="brand-highlight">Kiyo AI</span></h1></div>
        <div class="form-container">
            <div class="tab-switcher">
                <button class="tab-btn active" id="signinTabBtn" onclick="switchTab('signin')">Sign In</button>
                <button class="tab-btn" id="signupTabBtn" onclick="switchTab('signup')">Sign Up</button>
            </div>
            <form id="authForm" onsubmit="handleSubmit(event)">
                <div id="step1Fields" style="display:none;">
                    <input type="text" id="fullName" class="input-field" placeholder="Full Name">
                    <input type="date" id="dob" class="input-field">
                </div>
                <div id="commonFields">
                    <input type="email" id="email" class="input-field" placeholder="Email ID">
                    <input type="password" id="password" class="input-field" placeholder="Password">
                </div>
                <div id="step2Fields" style="display:none;">
                    <div class="custom-select-btn" id="btnClass" onclick="saveTempAndGo('class.html')"><span id="lblClass">Select Class...</span><i class="fa-solid fa-chevron-right"></i></div>
                    
                    <!-- DYNAMIC FIELDS -->
                    <div id="streamGroup" style="display:none; margin-top:10px;"><div class="custom-select-btn" onclick="openSelection('stream')"><span id="lblStream">Select Stream...</span></div></div>
                    <div id="dreamGroup" style="display:none; margin-top:10px;"><div class="custom-select-btn" onclick="openSelection('dream')"><span id="lblDream">Target Goal...</span></div></div>
                    <div id="boardGroup" style="margin-top:10px;"><div class="custom-select-btn" id="btnBoard" onclick="saveTempAndGo('board.html')"><span id="lblBoard">Select Board...</span></div></div>
                </div>
                <button type="button" id="nextBtn" class="action-btn" onclick="goToStep2()" style="display:none;">NEXT</button>
                <button type="submit" id="submitBtn" class="action-btn">SIGN IN</button>
            </form>
        </div>
    </div>

    <!-- Modals for Stream/Dream Selection -->
    <div class="modal-overlay" id="listModal">
        <div class="bottom-sheet">
            <h3 id="listTitle">Select Option</h3>
            <div id="listContent"></div>
        </div>
    </div>

    <script>
        // LOGIC FOR DROPPER / STREAM / GOAL
        function checkClassLogic(className) {
            const streamGroup = document.getElementById('streamGroup');
            const dreamGroup = document.getElementById('dreamGroup');
            const boardGroup = document.getElementById('boardGroup');

            if (className.toLowerCase().includes('11') || className.toLowerCase().includes('12') || className.toLowerCase().includes('dropper')) {
                streamGroup.style.display = 'block';
                dreamGroup.style.display = 'block';
                // Agar Dropper hai toh Board hide kar do
                boardGroup.style.display = className.toLowerCase().includes('dropper') ? 'none' : 'block';
            } else {
                streamGroup.style.display = 'none';
                dreamGroup.style.display = 'none';
                boardGroup.style.display = 'block';
            }
        }

        // Window Load (Ecosystem Restore)
        window.onload = function() {
            const savedClass = localStorage.getItem('kiyo_class');
            if(savedClass) {
                document.getElementById('lblClass').innerText = savedClass;
                checkClassLogic(savedClass);
            }
            // ... (baki functions wahi hain jo humne security ke liye banaye the)
        };

        function saveTempAndGo(url) {
            sessionStorage.setItem('temp_name', document.getElementById('fullName').value);
            window.location.href = url;
        }

        function switchTab(mode) {
            currentMode = mode;
            // ... (Tab logic wahi hai)
        }
        
        // ... (OTP, Security, API calls logic wahi purana secure wala)
    </script>
</body>
</html>
