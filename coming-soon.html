<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Kiyo AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>if(localStorage.getItem('kiyo_theme') === 'dark') document.documentElement.classList.add('dark-theme');</script>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --text: #0f172a; }
        html.dark-theme { --bg: #0B101E; --text: #f8fafc; }
        body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; }
        i { font-size: 60px; color: var(--primary); margin-bottom: 20px; }
        .back-btn { margin-top: 30px; padding: 12px 25px; background: var(--primary); color: #fff; text-decoration: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <i class="fa-solid fa-person-digging"></i>
    <h1 id="featureName">Feature</h1>
    <p>This section is currently under development.</p>
    <a href="javascript:history.back()" class="back-btn">Go Back</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById('featureName').innerText = (params.get('feature') || "Feature") + " is Coming Soon!";
    </script>
</body>
</html>
