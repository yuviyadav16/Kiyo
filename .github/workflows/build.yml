name: Build Private IG APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Generate Missing Android Folder (Ninja Hack)
        # Ye command tumhara code bachayegi aur missing android folder bana degi
        run: |
          mv lib/main.dart temp_main.dart
          flutter create --project-name private_ig --platforms=android .
          mv temp_main.dart lib/main.dart

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Cloud (Bypass Quota)
        run: |
          echo "YOUR APK DOWNLOAD LINK WILL APPEAR BELOW:"
          curl --upload-file build/app/outputs/flutter-apk/app-release.apk https://transfer.sh/Instagram.apk
