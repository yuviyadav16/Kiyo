name: Build Private IG APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Generate Android Folder & Apply Fixes
        run: |
          # 1. Code safe rakho aur Android folder banao
          mv lib/main.dart temp_main.dart
          flutter create --project-name private_ig --platforms=android .
          mv temp_main.dart lib/main.dart
          
          # 2. App ka naam "Instagram" set karo
          sed -i 's/android:label="private_ig"/android:label="Instagram"/g' android/app/src/main/AndroidManifest.xml
          
          # 3. INTERNET PERMISSION ADD KARO (Black screen fix)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 4. Play Protect (Older version warning) fix (SDK 34)
          sed -i 's/flutter.compileSdkVersion/34/g' android/app/build.gradle
          sed -i 's/flutter.targetSdkVersion/34/g' android/app/build.gradle

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK (Auto-delete in 1 Day)
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
