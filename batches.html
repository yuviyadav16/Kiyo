<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Select Your Goal - Kiyo AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        if(!localStorage.getItem('kiyo_user_email')) window.location.replace("login.html");
        if(localStorage.getItem('kiyo_theme') === 'dark') document.documentElement.classList.add('dark-theme');
    </script>

    <style>
        :root {
            --primary: #8b5cf6; 
            --accent-green: #10b981; 
            --bg-top: #f3e8ff; 
            --bg-bottom: #ffffff;
            --surface-color: #ffffff;
            --text-main: #0f172a; 
            --text-muted: #64748b; 
            --border-color: #e2e8f0;
            --nav-bg: #ffffff;
        }

        html.dark-theme {
            --bg-top: #0f111a; 
            --bg-bottom: #0B101E;
            --surface-color: #121826;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --border-color: rgba(255,255,255,0.05);
            --nav-bg: #121826;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; min-height: 100dvh; 
            background: linear-gradient(180deg, var(--bg-top) 0%, #f8fafc 45%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--text-main); font-family: system-ui, sans-serif; 
            overflow-x: hidden; -webkit-tap-highlight-color: transparent; 
        }

        /* TOPBAR */
        .topbar { display: flex; align-items: center; gap: 15px; padding: 15px 20px; position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);}
        html.dark-theme .topbar { background: rgba(18,24,38,0.8); }
        .back-btn { font-size: 20px; cursor: pointer; color: var(--text-main); text-decoration: none; transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        .greeting { margin: 0; font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;}

        .main-content { padding: 15px 20px; padding-bottom: 90px; }

        /* SEARCH BAR */
        .search-bar { background: var(--surface-color); border-radius: 14px; padding: 14px 16px; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--border-color); }
        .search-bar i { color: var(--text-muted); font-size: 15px; }
        .search-input { border: none; outline: none; background: transparent; width: 100%; font-size: 14px; font-weight: 600; color: var(--text-main); font-family: inherit;}

        .section-title { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }

        /* 6 CATEGORY GRID */
        .popular-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .popular-card { padding: 20px 15px; border-radius: 20px; text-decoration: none; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.04); }
        .popular-card:active { transform: scale(0.96); }
        .card-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 20px; background: rgba(255,255,255,0.7); box-shadow: 0 2px 8px rgba(0,0,0,0.05);}
        .popular-card h4 { margin: 0; font-size: 15px; font-weight: 800; color: #0f172a; line-height: 1.2;}

        /* Grid Colors */
        .card-blue { background: #e0f2fe; border-color: #bae6fd; }
        .card-blue .card-icon { color: #0284c7; }
        
        .card-green { background: #dcfce7; border-color: #bbf7d0; }
        .card-green .card-icon { color: #16a34a; }

        .card-purple { background: #f3e8ff; border-color: #e9d5ff; }
        .card-purple .card-icon { color: #9333ea; }
        
        .card-yellow { background: #fef9c3; border-color: #fef08a; }
        .card-yellow .card-icon { color: #ca8a04; }

        .card-pink { background: #ffe4e6; border-color: #fecdd3; }
        .card-pink .card-icon { color: #e11d48; }

        .card-orange { background: #ffedd5; border-color: #fed7aa; }
        .card-orange .card-icon { color: #c2410c; }

        /* Not Found Text */
        .not-found { display: none; text-align: center; font-weight: 800; color: var(--text-muted); font-size: 14px; margin-top: 30px; grid-column: 1 / -1;}

        /* BOTTOM NAVIGATION */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 12px 10px; box-sizing: border-box; z-index: 100; box-shadow: 0 -5px 20px rgba(0,0,0,0.03); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-muted); text-decoration: none; font-size: 11px; font-weight: 700; transition: 0.2s; width: 25%; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }
        .nav-item:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div class="topbar">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2 class="greeting">Select Your Goal</h2>
    </div>

    <div class="main-content">
        
        <!-- SEARCH BAR -->
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="search-input" placeholder="Search For Exams, Boards or Skills..." onkeyup="filterGoals(this.value)">
        </div>

        <div class="section-title">Popular Categories</div>
        
        <!-- 6 MASTER CATEGORY GRID -->
        <div class="popular-grid" id="goalGrid">
            
            <a href="school-boards.html" class="popular-card card-blue" data-search="school boards class 9 10 11 12 cbse icse state">
                <div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <h4>School Boards</h4>
            </a>
            
            <a href="neet.html" class="popular-card card-green" data-search="neet medical doctor mbbs biology">
                <div class="card-icon"><i class="fa-solid fa-stethoscope"></i></div>
                <h4>NEET</h4>
            </a>

            <a href="jee.html" class="popular-card card-purple" data-search="jee iit engineering math physics chemistry mains advanced">
                <div class="card-icon"><i class="fa-solid fa-atom"></i></div>
                <h4>JEE</h4>
            </a>

            <a href="upsc.html" class="popular-card card-yellow" data-search="upsc ias ips civil services">
                <div class="card-icon"><i class="fa-solid fa-landmark-dome"></i></div>
                <h4>UPSC</h4>
            </a>

            <a href="government-exams.html" class="popular-card card-pink" data-search="government govt exams ssc banking railway police">
                <div class="card-icon"><i class="fa-solid fa-building-columns"></i></div>
                <h4>Govt. Exams</h4>
            </a>

            <a href="skills.html" class="popular-card card-orange" data-search="tech skills coding english ai computer">
                <div class="card-icon"><i class="fa-solid fa-laptop-code"></i></div>
                <h4>Tech & Skills</h4>
            </a>

            <!-- NOT FOUND MESSAGE -->
            <div class="not-found" id="notFoundMsg">No categories found matching your search.</div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="batches.html" class="nav-item active">
            <i class="fa-solid fa-box-open"></i>
            <span>Batches</span>
        </a>
        <a href="study.html" class="nav-item">
            <i class="fa-solid fa-book-open"></i>
            <span>Study</span>
        </a>
        <a href="coming-soon.html" class="nav-item">
            <i class="fa-solid fa-layer-group"></i>
            <span>Other</span>
        </a>
    </div>

    <script>
        function filterGoals(query) {
            const q = query.toLowerCase().trim();
            const cards = document.querySelectorAll('.popular-card');
            let foundCount = 0;

            cards.forEach(card => {
                const searchTags = card.getAttribute('data-search') || '';
                const titleText = card.innerText.toLowerCase();
                
                if (searchTags.includes(q) || titleText.includes(q) || q === '') {
                    card.style.display = 'flex';
                    foundCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            // Show 'Not Found' if nothing matches
            document.getElementById('notFoundMsg').style.display = foundCount === 0 ? 'block' : 'none';
        }
    </script>
</body>
</html>
