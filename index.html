<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Educating Bharat</title>
    <style>
        /* Premium Educational Theme */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a; /* Professional dark slate */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.8s ease-in-out;
        }

        /* Center Main UI */
        .main-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUpFade 1.2s ease-out forwards;
        }

        /* Kiyo Logo */
        .kiyo-logo {
            width: 140px;
            height: auto;
            filter: drop-shadow(0px 10px 25px rgba(59, 130, 246, 0.4));
            animation: breath 4s infinite ease-in-out;
        }

        /* KIYO AI Text */
        .kiyo-title {
            color: #f8fafc;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 5px;
            margin-top: 25px;
            text-transform: uppercase;
        }

        /* Subtitle */
        .kiyo-subtitle {
            color: #94a3b8;
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 8px;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* Footer Branding */
        .footer-brand {
            position: absolute;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeInBrand 1.5s forwards 1s; 
        }

        .powered-text {
            color: #64748b;
            font-size: 10px;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .ticbull-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Small Circle for TicBull Logo */
        .ticbull-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
        }

        .ticbull-circle img {
            width: 100%; 
            height: auto;
            object-fit: contain;
        }

        .ticbull-name {
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        /* Animations */
        @keyframes breath {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0px 10px 25px rgba(59, 130, 246, 0.3)); }
            50% { transform: translateY(-8px); filter: drop-shadow(0px 15px 35px rgba(59, 130, 246, 0.6)); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInBrand {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="main-ui">
        <!-- Exact image file name from your repo -->
        <img src="15026_2.png" alt="Kiyo AI Core" class="kiyo-logo">
        <div class="kiyo-title">KIYO AI</div>
        <div class="kiyo-subtitle">Intelligent Learning Guide</div>
    </div>

    <div class="footer-brand">
        <div class="powered-text">POWERED BY</div>
        <div class="ticbull-container">
            <div class="ticbull-circle">
                <!-- Exact image file name from your repo -->
                <img src="14882.jpg" alt="TicBull">
            </div>
            <div class="ticbull-name">TICBULL</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 10 second timeout then redirect to login.html
            setTimeout(() => {
                document.body.style.opacity = '0'; // smooth fade out
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 800);
            }, 9200); 
        });
    </script>
</body>
</html>
