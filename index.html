<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Intelligent Learning</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* PREMIUM LIGHT EDUCATIONAL THEME */
        :root {
            --primary: #6366f1; /* Indigo */
            --primary-dark: #1e1b4b; /* Deep Dark Blue for Text */
            --kiyo-green: #10b981; /* Emerald Green */
            --bg-gradient: linear-gradient(180deg, #ede9fe 0%, #f8fafc 40%, #ffffff 100%);
            --text-muted: #64748b;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden; transition: opacity 0.6s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }

        /* Center Main UI */
        .main-ui {
            display: flex; flex-direction: column; align-items: center;
            transform: translateY(-30px); 
        }

        /* Clean Logo Container (No Ring) */
        .kiyo-logo-container {
            position: relative; 
            width: 100px; height: 100px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 25px;
        }

        /* Soft Indigo Glow */
        .kiyo-logo-container::before {
            content: ''; position: absolute; width: 80px; height: 80px;
            background: var(--primary); border-radius: 50%; filter: blur(25px); opacity: 0.25; z-index: 0;
        }

        /* Main Circular Logo */
        .kiyo-logo {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
            position: relative; z-index: 1; background-color: #ffffff;
            box-shadow: 0px 8px 20px rgba(99, 102, 241, 0.2); 
        }

        /* Smooth Typewriter Effect for KIYO AI (No Welcome) */
        .kiyo-title-wrapper {
            display: inline-flex; align-items: center; height: 45px; margin-top: 10px;
        }

        .kiyo-title {
            color: var(--primary-dark); font-size: 38px; font-weight: 900; letter-spacing: 2px;
            margin: 0; text-transform: uppercase;
            overflow: hidden; white-space: nowrap;
            border-right: 3px solid var(--kiyo-green); /* Green Blinking Cursor */
            padding-right: 8px;
            animation: typing 1.5s ease-out forwards, blinkCursor 0.8s step-end infinite;
            max-width: 0;
        }

        .kiyo-subtitle {
            color: var(--text-muted); font-size: 12px; letter-spacing: 1.5px; margin-top: 8px;
            font-weight: 600; text-transform: uppercase; opacity: 0;
            animation: fadeInSub 1s forwards 1.2s; 
        }

        /* SLEEK LINEAR PROGRESS BAR */
        .progress-container {
            margin-top: 30px; width: 180px; display: flex; flex-direction: column; align-items: center;
            opacity: 0; animation: fadeInSub 1s forwards 1.5s;
        }

        .progress-bar {
            width: 100%; height: 6px; background-color: #e2e8f0;
            border-radius: 10px; overflow: hidden; position: relative;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--kiyo-green));
            border-radius: 10px; transition: width 0.1s linear;
        }

        .progress-text {
            margin-top: 10px; font-size: 14px; font-weight: 800;
            color: var(--primary-dark); letter-spacing: 1px;
        }

        @keyframes typing { from { max-width: 0; } to { max-width: 250px; } }
        @keyframes blinkCursor { 50% { border-color: transparent; } }
        @keyframes fadeInSub { to { opacity: 1; } }

        /* Footer Branding & Socials */
        .footer-wrapper {
            position: absolute; bottom: 30px; display: flex; flex-direction: column; align-items: center;
            opacity: 0; animation: fadeInBrand 1.5s forwards 1.8s; 
        }

        .powered-text { color: var(--text-muted); font-size: 10px; letter-spacing: 2.5px; margin-bottom: 8px; text-transform: uppercase; font-weight: 800; }

        .ticbull-container {
            display: flex; align-items: center; gap: 10px; background: #ffffff;
            padding: 8px 20px; border-radius: 30px; border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
        }
        .ticbull-container:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.15); }
        .ticbull-circle { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #ffffff; }
        .ticbull-circle img { width: 100%; height: auto; object-fit: contain; }
        .ticbull-name { color: #0f172a; font-size: 14px; font-weight: 900; letter-spacing: 1.5px; }

        /* Social Icons */
        .social-icons { display: flex; gap: 18px; margin-top: 15px; }
        .social-icons a { color: #94a3b8; font-size: 18px; text-decoration: none; transition: 0.3s; }
        .social-icons a:hover { color: var(--primary); transform: translateY(-3px) scale(1.1); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-box {
            background: #ffffff; padding: 30px; border-radius: 24px; width: 80%; max-width: 320px;
            text-align: center; border: 1px solid #f1f5f9; transform: translateY(20px) scale(0.95); transition: 0.4s ease; box-shadow: 0px 20px 40px rgba(0,0,0,0.15); position: relative;
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }

        .close-btn { position: absolute; top: 15px; right: 20px; color: #94a3b8; font-size: 24px; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: var(--danger); }
        .modal-box h3 { color: #0f172a; margin-top: 0; font-size: 20px; margin-bottom: 20px; font-weight: 800;}

        .support-link {
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px 0; margin-bottom: 12px; border-radius: 14px; text-decoration: none; font-weight: 700; font-size: 14px; color: #fff; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .support-link:active { transform: scale(0.98); }
        .bg-telegram { background: #0088cc; } .bg-telegram:hover { background: #0077b5; }
        .bg-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .bg-email { background: #ea4335; } .bg-email:hover { background: #d33828; }

        @keyframes fadeInBrand { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-ui">
        <!-- Clean Logo (No Circular Ring) -->
        <div class="kiyo-logo-container">
            <img src="15026_2.png" alt="Kiyo AI Core" class="kiyo-logo">
        </div>
        
        <!-- Smooth Typing Title (No "Welcome to") -->
        <div class="kiyo-title-wrapper">
            <h1 class="kiyo-title">KIYO AI</h1>
        </div>
        <div class="kiyo-subtitle">Intelligent Learning Guide</div>

        <!-- Horizontal Progress Bar & 0-100% Counter -->
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>

    <!-- Footer Area -->
    <div class="footer-wrapper">
        <div class="powered-text">POWERED BY</div>
        
        <div class="ticbull-container" onclick="openSupport()">
            <div class="ticbull-circle">
                <img src="14882.jpg" alt="TicBull">
            </div>
            <div class="ticbull-name">TICBULL</div>
        </div>

        <div class="social-icons">
            <a href="https://youtube.com/@mryuviyadav" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/mryuvi_yadav" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://x.com/mryuviyadav" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://facebook.com/mryuviyadav" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://t.me/mryuviyadav" target="_blank"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </div>

    <!-- Help & Support Popup -->
    <div class="modal-overlay" id="supportModal">
        <div class="modal-box">
            <span class="close-btn" onclick="closeSupport()">&times;</span>
            <h3>Help & Support</h3>
            <a href="https://t.me/ticbullteam" target="_blank" class="support-link bg-telegram">
                <i class="fa-brands fa-telegram"></i> Join Telegram
            </a>
            <a href="https://www.instagram.com/ticbull" target="_blank" class="support-link bg-insta">
                <i class="fa-brands fa-instagram"></i> Follow Instagram
            </a>
            <a href="mailto:ticbull.support@gmail.com" class="support-link bg-email">
                <i class="fa-solid fa-envelope"></i> Email Support
            </a>
        </div>
    </div>

    <!-- SMART 8-SECOND PROGRESS JAVASCRIPT -->
    <script>
        const totalDuration = 8000; // EXACTLY 8 SECONDS
        let startTime = Date.now();
        let isPaused = false;
        let pausedTime = 0;
        
        const fillElem = document.getElementById('progressFill');
        const textElem = document.getElementById('progressText');

        function updateProgress() {
            if (isPaused) {
                // Shift start time forward so progress doesn't jump when resumed
                startTime += (Date.now() - pausedTime);
                pausedTime = Date.now();
                requestAnimationFrame(updateProgress);
                return;
            }

            let elapsed = Date.now() - startTime;
            let percent = Math.min((elapsed / totalDuration) * 100, 100);

            fillElem.style.width = percent + "%";
            textElem.innerText = Math.floor(percent) + "%";

            if (percent >= 100) {
                document.body.style.opacity = '0';
                setTimeout(() => {
                    // GLITCH FIX: Yahan check karega. Agar login hai toh direct dashboard jayega!
                    if (localStorage.getItem('kiyo_user_email')) {
                        window.location.replace("dashboard.html");
                    } else {
                        window.location.replace("login.html");
                    }
                }, 600); // Wait for fade out to finish before redirect
            } else {
                requestAnimationFrame(updateProgress);
            }
        }

        // Start progress immediately
        requestAnimationFrame(updateProgress);

        // Pause timer when popup opens
        function openSupport() {
            document.getElementById('supportModal').classList.add('active');
            isPaused = true;
            pausedTime = Date.now();
        }

        // Resume timer when popup closes
        function closeSupport() {
            document.getElementById('supportModal').classList.remove('active');
            isPaused = false;
        }
    </script>
</body>
</html>
