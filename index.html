<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Launching</title>
    <style>
        /* Ekdum clean background aur scroll lock */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Video load hone se pehle seamless dark rahega */
            overflow: hidden;
        }

        /* Video screen ko puri tarah se bina strech kiye cover karegi */
        #intro-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Mobile aur Desktop dono me perfect ratio */
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.6s ease-in-out; /* Fade out effect ke liye transition */
        }

        /* Class jo video khatam hone par usko smooth gayab karegi */
        .fade-out {
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <!-- Preload auto taaki bina buffering jaldi start ho -->
    <video id="intro-video" autoplay muted playsinline preload="auto">
        <source src="15200.mp4" type="video/mp4">
    </video>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("intro-video");

            // Video play command
            video.play().catch(error => {
                console.log("Browser autoplay restriction, waiting for interaction", error);
            });

            // Ye function smooth fade-out aur redirect ko handle karega
            function transitionToLogin() {
                video.classList.add("fade-out"); // Fade-out animation start
                
                // 600 milliseconds (fade-out khatam hone ka wait) ke baad naye page par bhejega
                setTimeout(() => {
                    window.location.href = "login.html"; 
                }, 600); 
            }

            // 1. Primary trigger: Jaise hi 10 sec ki video officially complete ho
            video.addEventListener("ended", transitionToLogin);

            // 2. Failsafe trigger: Agar device slow hai, toh 11.5 seconds par forcefully aage bhej dega
            setTimeout(() => {
                // Agar video khud khatam nahi hui hai, tabhi failsafe chalega
                if (!video.ended) {
                    transitionToLogin();
                }
            }, 11500); 
        });
    </script>
</body>
</html>
