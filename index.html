<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Launching</title>
    <style>
        /* Pure black premium background for video */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Video styling for mobile optimization */
        #intro-video {
            width: 100%;
            max-width: 450px; /* Mobile width maintain rakhne ke liye */
            height: auto;
            object-fit: cover;
            border-radius: 10px; /* Thoda smooth edge dene ke liye (optional) */
        }

        /* Bottom TicBull Brand */
        #brand-footer {
            position: absolute;
            bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeIn 1.5s forwards 0.5s; /* Video start hone ke thodi der baad fade in hoga */
        }
        
        #brand-footer span {
            color: #64748b;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #ticbull-logo {
            width: 40px; /* Small brand logo */
            filter: drop-shadow(0px 0px 5px rgba(255, 255, 255, 0.2));
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Kiyo AI Motion Graphics Video -->
    <!-- 'muted' zaroori hai mobile browsers me autoplay allow karne ke liye -->
    <video id="intro-video" autoplay muted playsinline>
        <source src="15200.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Bottom Brand Logo (TicBull) -->
    <div id="brand-footer">
        <span>Powered by</span>
        <img id="ticbull-logo" src="15022_2.png" alt="TicBull">
        <span style="color: white; font-weight: bold;">TicBull</span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("intro-video");

            // Ensure video plays smoothly
            video.play().catch(error => {
                console.log("Autoplay blocked by browser. User interaction might be needed.", error);
            });

            // 1. Primary Logic: Jaise hi video puri chal jayegi, automatically login page par bhej dega
            video.addEventListener("ended", () => {
                window.location.href = "login.html"; 
            });

            // 2. Fallback Logic: In case internet/browser issue ki wajah se video nahi chalti,
            // toh 7 seconds baad backup ke taur par aage badha dega (Apni video length ke hisaab se adjust kar lena)
            setTimeout(() => {
                window.location.href = "login.html";
            }, 7000); 
        });
    </script>
</body>
</html>
