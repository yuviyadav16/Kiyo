<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Launching</title>
    <style>
        body, html {
            margin: 0; padding: 0; background-color: #000000; height: 100%; overflow: hidden;
            display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif;
        }
        
        /* Loading text video ke piche rahega */
        #loading-text { color: #333; position: absolute; z-index: -1; font-size: 1.2rem; }
        
        video {
            width: 100vw; height: 100vh; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* Fallback button agar browser autoplay rok de */
        #start-btn {
            position: absolute; z-index: 10; padding: 12px 24px; background: #3b82f6; 
            color: white; border: none; font-size: 16px; border-radius: 8px; 
            font-weight: bold; cursor: pointer; display: none; box-shadow: 0px 4px 15px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

    <div id="loading-text">Loading Kiyo AI...</div>
    
    <button id="start-btn" onclick="forcePlay()">Tap to Launch Kiyo AI</button>

    <video id="intro-video" muted playsinline autoplay preload="auto">
        <!-- Path me ./ lagana zaroori hai -->
        <source src="./15200.mp4" type="video/mp4">
    </video>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("intro-video");
            const btn = document.getElementById("start-btn");

            // Try to play automatically
            let playPromise = video.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // Autoplay successful, kuch nahi karna
                }).catch(error => {
                    // Agar browser ne autoplay block kiya, toh button dikhao
                    console.log("Autoplay blocked");
                    btn.style.display = "block";
                });
            }

            // Jab user button dabaye
            window.forcePlay = function() {
                video.play();
                btn.style.display = "none";
            };

            // Video khatam hone par agle page par bhejna
            video.addEventListener("ended", () => {
                window.location.href = "login.html"; 
            });
            
            // Backup timer (agar video fail ho jaye)
            setTimeout(() => {
                if(!video.ended) { window.location.href = "login.html"; }
            }, 11500);
        });
    </script>
</body>
</html>
