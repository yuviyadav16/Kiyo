<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiyo AI - Powered by TicBull</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #6da499; /* Green background fallback */
            overflow: hidden;
        }

        .splash-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- Main Intro Video - Autoplay -->
        <video id="introVideo" playsinline autoplay muted>
            <source src="15200.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('introVideo');

        // Force play for mobile
        window.addEventListener('load', () => {
            video.play().catch(e => console.log("Autoplay blocked by browser"));
        });

        // Auto redirect to login page after 15 seconds (when video ends)
        video.addEventListener('ended', () => {
            document.body.style.transition = 'opacity 0.6s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = '2_login.html'; 
            }, 600);
        });
    </script>
</body>
</html>
