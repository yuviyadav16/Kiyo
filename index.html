<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiyo AI - Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* PREMIUM LIGHT THEME (Matches your screenshot) */
            --primary-dark: #1e1b4b; /* Deep Blue for "Welcome to" */
            --kiyo-green: #10b981; /* Emerald Green for "Kiyo AI" */
            --bg-gradient: linear-gradient(180deg, #f3f0ff 0%, #f8fafc 50%, #ffffff 100%);
            --text-muted: #64748b;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; /* STRICTLY 1 SCREEN - NO SCROLL */
            -webkit-tap-highlight-color: transparent;
        }

        .main-wrapper {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* BULB LOGO CONTAINER */
        .logo-container {
            width: 110px; height: 110px; margin-bottom: 25px;
            border-radius: 50%; background: #ffffff;
            box-shadow: 0px 10px 30px rgba(99, 102, 241, 0.2);
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }
        
        /* Spinner animation around logo */
        .logo-spinner {
            position: absolute; top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%; border: 3px solid transparent;
            border-top-color: var(--kiyo-green); border-right-color: var(--primary-dark);
            animation: spin 2s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .logo-img { width: 75px; height: 75px; object-fit: contain; z-index: 2; }

        /* TYPOGRAPHY */
        .welcome-text {
            font-size: 32px; font-weight: 900; color: var(--primary-dark); 
            margin: 0; line-height: 1.1; letter-spacing: -0.5px;
        }
        .brand-text {
            font-size: 38px; font-weight: 900; color: var(--kiyo-green); 
            margin: 0; letter-spacing: -0.5px;
        }
        .sub-text {
            font-size: 13px; color: var(--text-muted); font-weight: 600; 
            margin-top: 10px; letter-spacing: 0.5px;
        }

        /* FOOTER (Bottom Fixed) */
        .app-footer {
            position: absolute; bottom: 30px; width: 100%; text-align: center;
            animation: slideUp 1s ease-in-out;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .powered-by { font-size: 9px; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; }
        
        .ticbull-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: #ffffff; border: 1px solid #e2e8f0; 
            padding: 8px 20px; border-radius: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .ticbull-badge img { width: 20px; height: 20px; object-fit: contain; } 
        .ticbull-badge span { font-size: 14px; font-weight: 900; color: #0f172a; letter-spacing: 1px;}

        .user-socials { display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; }
        .user-socials a { color: #94a3b8; font-size: 18px; text-decoration: none; transition: 0.3s; }
        
        .policy-links { font-size: 11px; color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Logo Section -->
        <div class="logo-container">
            <div class="logo-spinner"></div>
            <!-- Update this src with your actual bulb logo file name if different -->
            <img src="15026_2.png" alt="Kiyo Bulb" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3203/3203071.png'">
        </div>

        <!-- Typography Section exactly like your screenshot -->
        <h1 class="welcome-text">Welcome to</h1>
        <h1 class="brand-text">Kiyo AI</h1>
        <p class="sub-text">Your Intelligent Learning Guide</p>
    </div>

    <!-- Footer Section -->
    <div class="app-footer">
        <div class="powered-by">POWERED BY</div>
        <div class="ticbull-badge">
            <img src="14882.jpg" alt="TicBull"> 
            <span>TICBULL</span>
        </div>

        <div class="user-socials">
            <a href="https://youtube.com/@mryuviyadav"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/mryuvi_yadav"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://facebook.com/mryuviyadav"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="https://x.com/mryuviyadav"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://t.me/mryuviyadav"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <div class="policy-links">
            Terms of Service &bull; Privacy Policy
        </div>
    </div>

    <script>
        // Auto redirect to login page after 3.5 seconds
        setTimeout(() => {
            window.location.href = "login.html";
        }, 3500);
    </script>
</body>
</html>
