<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiyo AI - Educating Bharat</title>
    <style>
        /* Premium Dark Theme */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Deep rich black */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 1s ease-in-out; /* Smooth page exit */
        }

        /* Center Main UI Container */
        .main-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideUpFade 1.5s ease-out forwards;
        }

        /* Main Kiyo Logo (Brain/Bulb) */
        .kiyo-logo {
            width: 160px;
            height: auto;
            filter: drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.1));
            animation: breath 3s infinite ease-in-out; /* Sublte breathing effect */
        }

        /* Kiyo AI Text */
        .kiyo-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-top: 20px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Bottom Footer Container */
        .footer-brand {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeInBrand 2s forwards 1.5s; /* Appears after main UI */
        }

        .powered-text {
            color: #71717a;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Small Circle TicBull Logo Layout */
        .ticbull-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Circle Image Styling */
        .ticbull-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid #27272a;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .ticbull-circle img {
            width: 140%; /* Adjusted to crop out black space from the screenshot */
            height: 140%;
            object-fit: contain;
        }

        .ticbull-name {
            color: #e4e4e7;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Keyframe Animations */
        @keyframes breath {
            0%, 100% { transform: scale(1); filter: drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.1)); }
            50% { transform: scale(1.05); filter: drop-shadow(0px 0px 25px rgba(255, 255, 255, 0.3)); }
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInBrand {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Main Center Content -->
    <div class="main-ui">
        <img src="15026_3.png" alt="Kiyo AI Core" class="kiyo-logo">
        <div class="kiyo-title">Kiyo AI</div>
    </div>

    <!-- Bottom Footer Branding -->
    <div class="footer-brand">
        <div class="powered-text">Powered By</div>
        <div class="ticbull-container">
            <div class="ticbull-circle">
                <img src="14882.jpg" alt="TicBull Logo">
            </div>
            <div class="ticbull-name">TICBULL</div>
        </div>
    </div>

    <script>
        // 10 Second Redirect Logic
        document.addEventListener("DOMContentLoaded", () => {
            const displayTime = 10000; // 10 seconds total wait
            const transitionTime = 800; // time taken for fade out

            setTimeout(() => {
                // 1. Pehle screen ko fade out karo (black smooth exit)
                document.body.style.opacity = '0';
                
                // 2. Fade out complete hone ke baad next page par bhejo
                setTimeout(() => {
                    window.location.href = "login.html";
                }, transitionTime);
                
            }, displayTime - transitionTime);
        });
    </script>
</body>
</html>
