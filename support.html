<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help & Support - Kiyo AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>if(localStorage.getItem('kiyo_theme') === 'dark') document.documentElement.classList.add('dark-theme');</script>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --border: #e2e8f0; }
        html.dark-theme { --bg: #0B101E; --surface: #121826; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .header a { color: var(--text); font-size: 20px; text-decoration: none; }
        .card { background: var(--surface); padding: 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; text-align: center; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 15px 0; margin-bottom: 12px; border-radius: 12px; text-decoration: none; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header"><a href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i></a> <h2>Help & Support</h2></div>
    
    <div class="card">
        <h3 style="margin-top:0;">TicBull Support Team</h3>
        <p style="font-size:14px; opacity:0.8; margin-bottom:25px;">Our team is available 24/7 to help you with your educational journey.</p>
        
        <a href="mailto:ticbull.support@gmail.com" class="btn" style="background:#ea4335;"><i class="fa-solid fa-envelope"></i> Email Support</a>
        <a href="https://t.me/ticbullteam" class="btn" style="background:#0088cc;"><i class="fa-brands fa-telegram"></i> Telegram Channel</a>
    </div>

    <div class="card">
        <h3 style="margin-top:0;">Connect with Mr. Yuvi Yadav</h3>
        <a href="https://youtube.com/@mryuviyadav" class="btn" style="background:#ff0000;"><i class="fa-brands fa-youtube"></i> YouTube</a>
        <a href="https://www.instagram.com/mryuvi_yadav" class="btn" style="background: linear-gradient(45deg, #f09433, #bc1888);"><i class="fa-brands fa-instagram"></i> Instagram</a>
        <a href="https://x.com/mryuviyadav" class="btn" style="background:#000000;"><i class="fa-brands fa-x-twitter"></i> X (Twitter)</a>
        <a href="https://facebook.com/mryuviyadav" class="btn" style="background:#1877f2;"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
    </div>
</body>
</html>
