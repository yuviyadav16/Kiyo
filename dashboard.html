<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiyo AI Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --accent-green: #10b981; --bg: #f8fafc; --text: #0f172a; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        /* Navbar */
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* 16:9 Profile Card */
        .profile-card { background: linear-gradient(135deg, #6366f1, #4f46e5); margin: 20px; padding: 25px; border-radius: 20px; color: #fff; position: relative; }
        .profile-card h2 { margin: 0; font-size: 22px; }
        .profile-card p { opacity: 0.8; margin: 5px 0; font-size: 14px; }

        /* Dashboard Grid */
        .dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .menu-box { background: #fff; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .menu-box:active { transform: scale(0.95); }
        .menu-box i { font-size: 28px; color: var(--primary); margin-bottom: 10px; }

        /* Side Menu */
        .side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #fff; z-index: 1000; transition: 0.3s; box-shadow: 2px 0 10px rgba(0,0,0,0.2); }
        .side-menu.active { left: 0; }
        .menu-item { padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px; cursor: pointer; }

        /* Modals */
        .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 2000; }
        .popup.active { display: flex; }
        .box { background: #fff; padding: 30px; border-radius: 20px; width: 80%; text-align: center; }
    </style>
</head>
<body>

    <div class="navbar">
        <i class="fa-solid fa-bars" onclick="document.getElementById('sideMenu').classList.add('active')"></i>
        <div style="font-weight:900; font-size: 18px;">KIYO AI</div>
        <i class="fa-solid fa-bell"></i>
    </div>

    <div class="profile-card">
        <h2 id="nameDisplay">Dad King</h2>
        <p id="cityDisplay">Siwan, Bihar</p>
        <p style="margin-top:10px; font-weight:bold;">Goal: <span id="goalDisplay">NEET</span></p>
    </div>

    <div class="dashboard-grid">
        <div class="menu-box"><i class="fa-solid fa-comments"></i><br>AI Chat</div>
        <div class="menu-box"><i class="fa-solid fa-book-open"></i><br>Syllabus</div>
        <div class="menu-box"><i class="fa-solid fa-file-pen"></i><br>PYQs</div>
        <div class="menu-box"><i class="fa-solid fa-clock"></i><br>Test</div>
        <div class="menu-box"><i class="fa-solid fa-chart-line"></i><br>Result</div>
        <div class="menu-box"><i class="fa-solid fa-circle-play"></i><br>Lectures</div>
    </div>

    <!-- Sidebar -->
    <div class="side-menu" id="sideMenu">
        <div style="padding: 20px; background: var(--primary); color: #fff;"><h3>Menu</h3></div>
        <div class="menu-item" onclick="openPopup('settingsPopup')"><i class="fa-solid fa-gear"></i> Settings</div>
        <div class="menu-item"><i class="fa-solid fa-user"></i> Profile</div>
        <div class="menu-item"><i class="fa-solid fa-shield"></i> Privacy Policy</div>
        <div class="menu-item"><i class="fa-solid fa-file-contract"></i> Terms & Conditions</div>
        <div class="menu-item" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
        <i class="fa-solid fa-xmark" style="padding:20px; cursor:pointer;" onclick="document.getElementById('sideMenu').classList.remove('active')"></i>
    </div>

    <!-- Settings Popup -->
    <div class="popup" id="settingsPopup">
        <div class="box">
            <h3>App Settings</h3>
            <button onclick="editProfile()">✏️ Edit Profile</button>
            <button onclick="deleteAccountTrigger()" style="background:red; color:#fff; border:none; padding:10px; width:100%;">Permanently Delete Account</button>
            <button onclick="closePopups()">Close</button>
        </div>
    </div>

    <script>
        function openPopup(id) { document.getElementById(id).classList.add('active'); }
        function closePopups() { document.querySelectorAll('.popup').forEach(p => p.classList.remove('active')); }
        
        function deleteAccountTrigger() {
            if(confirm("WARNING: This will delete all data permanently! Send OTP?")) {
                alert("OTP Sent for account deletion verification.");
                // Add your delete API call here
            }
        }
        
        function logout() { localStorage.clear(); window.location.href = "login.html"; }
        function editProfile() {
            let n = prompt("New Name:");
            if(n) { document.getElementById('nameDisplay').innerText = n; localStorage.setItem('kiyo_user_name', n); }
        }
    </script>
</body>
</html>
