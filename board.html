<!DOCTYPE html>
<html>
<head>
    <title>Select Board</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>/* Use same CSS as class.html */</style>
</head>
<body>
    <div class="header"><a href="login.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a><h1 class="title">Select Board</h1></div>
    <div class="list-container" id="boardList"></div>
    <script>
        const boards = ["CBSE", "ICSE", "BSEB (Bihar)", "UPMSP (UP)", "MPBSE (MP)", "RBSE (Rajasthan)", "MSBSHSE (Maharashtra)", "WBBSE (West Bengal)", "GSEB (Gujarat)", "PSEB (Punjab)", "KSEEB (Karnataka)", "TNBSE (Tamil Nadu)", "Other State Board"];
        const container = document.getElementById('boardList');
        boards.forEach(b => {
            container.innerHTML += `<div class="list-item" onclick="save('${b}')"><span class="item-name">${b}</span></div>`;
        });
        function save(val) { localStorage.setItem('kiyo_board', val); window.location.replace('login.html'); }
    </script>
</body>
</html>
